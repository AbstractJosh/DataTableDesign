<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data table — Records / Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
  /* ---- Modernist tokens (project override: navy accent) ---- */
  :root {
    --accent: #1d2d46;          /* project override of the system red */
    --ground: #f3f2f2;
    --surface: #eae9e9;
    --ink: #201e1d;
    --n100: #f8f4f4;
    --n300: #d7d3d3;
    --n400: #bab6b6;
    --n500: #9b9797;
    --n600: #7d7979;
    --n700: #605d5d;
    --danger: #ec3013;          /* destructive / negative only */
    --success: #2f7d4f;
    --reversed: #f3f2f2;
    --cell-pad-y: 15px;         /* comfortable; compact = 9px */
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--ground);
    color: var(--ink);
    font-family: 'Archivo', system-ui, sans-serif;
    padding: 40px 48px 64px;
  }
  input, button { font-family: inherit; }
  ::selection { background: var(--n300); }
  button:focus-visible, input:focus-visible, th:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  @keyframes dtExpand {
    from { opacity: 0; max-height: 0; }
    to   { opacity: 1; max-height: 440px; }
  }

  .shell { max-width: 1400px; margin: 0 auto; }

  /* ---- 1. Page header ---- */
  .page-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 32px; border-bottom: 2px solid var(--ink); padding-bottom: 18px;
  }
  .kicker {
    font-size: 11px; font-weight: 600; letter-spacing: .18em;
    text-transform: uppercase; color: var(--n600); margin-bottom: 10px;
  }
  .page-head h1 {
    margin: 0; font-size: 44px; font-weight: 800;
    letter-spacing: -.025em; line-height: .95;
  }
  .stats { display: flex; gap: 40px; padding-bottom: 4px; }
  .stat-label {
    font-size: 10px; font-weight: 600; letter-spacing: .16em;
    text-transform: uppercase; color: var(--n600); margin-bottom: 6px;
  }
  .stat-value { font-size: 22px; font-weight: 700; line-height: 1; }

  /* ---- 2. Toolbar ---- */
  .toolbar {
    display: flex; align-items: stretch; gap: 12px;
    padding: 18px 0; flex-wrap: wrap;
  }
  .search {
    flex: 1 1 280px; max-width: 380px; min-width: 220px;
    padding: 11px 13px; border: 2px solid var(--ink); border-radius: 0;
    background: var(--n100); color: var(--ink);
    font-size: 13px; font-weight: 500; outline: none;
  }
  .seg { display: flex; border: 2px solid var(--ink); background: var(--n100); }
  .seg-opt {
    padding: 11px 14px; border: none; border-right: 2px solid var(--ink);
    background: transparent; color: var(--ink);
    font-size: 11px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; cursor: pointer;
  }
  .seg-opt[aria-pressed="true"] { background: var(--accent); color: var(--reversed); }
  .spacer { flex: 1; }
  .btn-secondary {
    padding: 11px 16px; border: 2px solid var(--ink); background: transparent;
    color: var(--ink); font-size: 11px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; cursor: pointer; text-align: left;
  }
  .btn-primary {
    width: 42px; height: 42px; display: inline-flex;
    align-items: center; justify-content: center;
    border: 2px solid var(--accent); background: var(--accent);
    color: var(--reversed); padding: 0; cursor: pointer;
  }

  /* ---- 3. Bulk-action bar ---- */
  .bulk {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 12px 16px;
    background: var(--accent); color: var(--reversed);
  }
  .bulk-count {
    font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  }
  .bulk-actions { display: flex; gap: 10px; }
  .bulk-btn {
    padding: 7px 12px; border: 2px solid var(--reversed); background: transparent;
    color: var(--reversed); font-size: 10px; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase; cursor: pointer;
  }
  .bulk-btn.ghost { border: none; opacity: .7; }
  .bulk-btn.solid { background: var(--reversed); color: var(--accent); }
  .bulk-btn:has(svg) { display: inline-flex; align-items: center; padding: 6px 10px; }
  .bulk-prompt {
    align-self: center; font-size: 11px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase;
  }

  /* ---- 4. Table ---- */
  .table-scroll { overflow-x: auto; }
  table {
    width: 100%; min-width: 1222px;
    border-collapse: collapse; table-layout: fixed; font-size: 13px;
  }
  th {
    padding: 12px; text-align: left;
    font-size: 10px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
    color: var(--reversed); background: var(--accent);
    border-bottom: 2px solid var(--accent);
    border-right: 2px solid rgba(243, 242, 242, .35);
  }
  th.col-logo   { width: 56px;  padding: 8px 10px; text-align: center; }
  th.col-check  { width: 56px;  padding: 12px 8px; text-align: center; }
  th.col-action { width: 130px; padding: 12px 16px 12px 12px; border-right: none; }
  th.col-data { cursor: default; opacity: .92; }
  th.col-data.is-sorted { opacity: 1; }
  .th-inner { display: flex; align-items: center; gap: 7px; user-select: none; }
  .grip {
    cursor: grab; font-size: 13px; line-height: 1; letter-spacing: -2px;
    color: rgba(243, 242, 242, .55);
  }
  .th-label { cursor: pointer; white-space: nowrap; }
  .caret {
    font-size: 8px; line-height: 1; display: inline-block;
    color: rgba(243, 242, 242, .45);
    transition: transform 180ms ease, color 180ms ease;
  }
  .is-sorted .caret { color: var(--reversed); }
  .caret.asc { transform: rotate(180deg); }
  .logo { height: 32px; width: auto; display: block; margin: 0 auto; }

  .check-box {
    width: 22px; height: 22px; display: inline-flex;
    align-items: center; justify-content: center;
    border: 2.5px solid var(--n500); background: transparent;
    padding: 0; color: var(--accent); cursor: pointer;
  }
  .check-box.on { border-color: var(--accent); }
  th .check-box { border-color: rgba(243, 242, 242, .8); color: var(--reversed); }

  /* The 3px row-selected marker is drawn as an inset shadow rather than a
     `border-left` on the tr: under border-collapse a row border half-overflows
     the table box and forces a permanent horizontal scrollbar. Same 3px rule,
     no layout contribution. */
  tbody tr.selected { background: var(--surface); }
  tbody tr.selected > td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  tbody.zebra-odd > tr:first-child:not(.selected) { background: var(--n100); }
  tbody.picking > tr:first-child:not(.selected) {
    background: color-mix(in srgb, var(--accent) 6%, var(--ground));
  }
  tbody.confirming > tr:first-child {
    background: color-mix(in srgb, var(--danger) 8%, var(--ground));
  }
  td {
    padding: var(--cell-pad-y) 12px;
    border-bottom: 1px solid var(--n300);
    vertical-align: middle;
  }
  tbody.expanded > tr:first-child > td { border-bottom: none; }
  td.cell-grip   { padding: var(--cell-pad-y) 10px; text-align: center; }
  td.cell-check  { padding: var(--cell-pad-y) 8px;  text-align: center; }
  td.cell-action { padding: var(--cell-pad-y) 16px var(--cell-pad-y) 12px; }
  .row-grip { cursor: grab; font-size: 14px; line-height: 1; letter-spacing: -2px; color: var(--n400); }

  .name-cell { display: flex; align-items: center; gap: 9px; }
  .chevron {
    width: 18px; height: 18px; flex: 0 0 18px;
    display: inline-flex; align-items: center; justify-content: center;
    border: none; background: transparent; color: var(--ink);
    padding: 0; cursor: pointer;
  }
  .chevron svg { display: block; transition: transform 180ms ease; }
  .chevron.open { color: var(--accent); }
  .chevron.open svg { transform: rotate(180deg); }
  .name-text { font-weight: 700; }
  .cell-text { font-weight: 500; font-variant-numeric: tabular-nums; }
  .cell-text.muted { color: var(--n700); }

  .pill {
    display: inline-block; padding: 4px 9px; border: 2px solid;
    font-size: 10px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; white-space: nowrap;
  }
  .pill.success  { color: var(--success); border-color: var(--success); }
  .pill.progress { color: var(--n700);    border-color: var(--n500); }
  .pill.failed   { color: var(--danger);  border-color: var(--danger); }

  .row-actions { display: flex; gap: 8px; }
  .icon-btn {
    width: 30px; height: 30px; display: inline-flex;
    align-items: center; justify-content: center;
    border: 2px solid; background: transparent; padding: 0; cursor: pointer;
  }
  .icon-btn.edit { color: var(--accent); border-color: var(--accent); }
  .icon-btn.edit.armed { background: var(--accent); color: var(--reversed); }
  .icon-btn.del  { color: var(--danger); border-color: var(--danger); }
  /* delete confirmation, in place of the two action buttons */
  .icon-btn.confirm { background: var(--danger); border-color: var(--danger); color: var(--reversed); }
  .icon-btn.cancel  { color: var(--ink); border-color: var(--ink); }

  /* ---- inline edit: pick a field, then edit it ---- */
  .pick {
    display: inline-block; font: inherit; color: inherit; text-align: left;
    background: transparent; border: none; padding: 3px 5px; margin: -3px -5px;
    cursor: pointer;
    outline: 2px dashed color-mix(in srgb, var(--accent) 45%, transparent);
    outline-offset: 0;
  }
  .pick:hover, .pick:focus-visible {
    outline: 2px solid var(--accent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .cell-input {
    width: 100%; padding: 5px 7px;
    border: 2px solid var(--accent); border-radius: 0;
    background: var(--n100); color: var(--ink);
    font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums;
    outline: none;
  }
  .status-pick {
    display: inline-flex; flex-direction: column;
    border: 2px solid var(--accent); background: var(--n100);
  }
  .status-pick button {
    padding: 5px 8px; border: none; border-bottom: 2px solid var(--accent);
    background: transparent; color: var(--ink); text-align: left;
    font-size: 9px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; cursor: pointer;
  }
  .status-pick button:last-child { border-bottom: none; }
  .status-pick button.on { background: var(--accent); color: var(--reversed); }

  /* detail row */
  td.detail-cell {
    padding: 0 12px 18px 46px;
    background: var(--surface);
    border-bottom: 1px solid var(--n300);
  }
  .detail-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
    background: var(--n300); border: 1px solid var(--n300);
    overflow: hidden; animation: dtExpand 200ms ease-out;
  }
  .pane { background: var(--n100); padding: 16px 18px; }
  .pane-wide { grid-column: span 4; }
  .pane-label {
    font-size: 10px; font-weight: 700; letter-spacing: .16em;
    text-transform: uppercase; color: var(--n600); margin-bottom: 8px;
  }
  .pane-value { font-size: 14px; font-weight: 600; }
  .pane-note { font-size: 14px; line-height: 1.5; max-width: 70ch; text-wrap: pretty; }

  /* empty state */
  .empty { padding: 56px 0; border-bottom: 2px solid var(--ink); text-align: left; }
  .empty-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .empty-body { font-size: 13px; color: var(--n700); }

  /* ---- 5. Footer ---- */
  .foot {
    display: flex; align-items: center; justify-content: space-between;
    gap: 24px; padding: 18px 0 0; border-top: 2px solid var(--ink); flex-wrap: wrap;
  }
  .foot-count { font-size: 12px; font-weight: 500; color: var(--n700); }
  .foot-count strong { color: var(--ink); font-weight: 700; }
  .pager { display: flex; gap: 6px; align-items: center; }
  .pager-nav {
    height: 34px; padding: 0 12px; border: 2px solid var(--n400);
    background: transparent; color: var(--n700);
    font-size: 11px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; cursor: pointer;
  }
  .pager-num {
    min-width: 34px; height: 34px; padding: 0 8px;
    border: 2px solid var(--n400); background: transparent; color: var(--ink);
    font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .pager-num.active {
    background: var(--accent); border-color: var(--accent); color: var(--reversed);
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="shell">

  <!-- 1. Page header -->
  <div class="page-head">
    <div>
      <div class="kicker">Records / Directory</div>
      <h1>Data table</h1>
    </div>
    <div class="stats">
      <div>
        <div class="stat-label">Total</div>
        <div class="stat-value" id="statTotal">0</div>
      </div>
      <div>
        <div class="stat-label">Matching</div>
        <div class="stat-value" id="statMatching">0</div>
      </div>
      <div>
        <div class="stat-label">Selected</div>
        <div class="stat-value" id="statSelected">0</div>
      </div>
    </div>
  </div>

  <!-- 2. Toolbar -->
  <div class="toolbar">
    <input id="search" class="search" type="text" placeholder="Search name, email or address" aria-label="Search records">
    <div class="seg" id="filters" role="group" aria-label="Status filter"></div>
    <div class="spacer"></div>
    <button type="button" class="btn-secondary" id="resetOrder">Reset order</button>
    <button type="button" class="btn-primary" title="New record" aria-label="New record">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
    </button>
  </div>

  <!-- 3. Bulk-action bar -->
  <div class="bulk" id="bulkBar" hidden>
    <div class="bulk-count"><span id="bulkCount">0</span> selected</div>
    <div class="bulk-actions" id="bulkActions">
      <button type="button" class="bulk-btn">Export</button>
      <button type="button" class="bulk-btn">Archive</button>
      <button type="button" class="bulk-btn" id="bulkDelete">Delete</button>
      <button type="button" class="bulk-btn ghost" id="bulkClear">Clear</button>
    </div>
    <div class="bulk-actions" id="bulkConfirm" hidden>
      <span class="bulk-prompt">Delete <span id="bulkConfirmCount">0</span> records?</span>
      <button type="button" class="bulk-btn solid" id="bulkYes" title="Confirm delete" aria-label="Confirm delete"></button>
      <button type="button" class="bulk-btn" id="bulkNo" title="Keep them" aria-label="Cancel delete"></button>
    </div>
  </div>

  <!-- 4. Table -->
  <div class="table-scroll">
    <table id="table">
      <thead>
        <tr id="headRow">
          <th class="col-logo">
            <img class="logo" src="design_handoff_data_table/uploads/Alp_Havac%C4%B1l%C4%B1k-1538940458.png" alt="ALP">
          </th>
          <th class="col-check">
            <button type="button" class="check-box" id="selectAll" data-act="all" aria-pressed="false" aria-label="Select all rows"></button>
          </th>
          <!-- data columns injected here -->
          <th class="col-action">Action</th>
        </tr>
      </thead>
      <!-- record tbodies injected here -->
    </table>
  </div>

  <div class="empty" id="empty" hidden>
    <div class="empty-title">No records match</div>
    <div class="empty-body">Clear the search field or pick a different status filter.</div>
  </div>

  <!-- 5. Footer -->
  <div class="foot">
    <div class="foot-count">Showing <strong id="range">0</strong> of <span id="footTotal">0</span> entries</div>
    <div class="pager">
      <button type="button" class="pager-nav" id="prev">&lsaquo; Prev</button>
      <span id="pageNums" style="display:flex;gap:6px"></span>
      <button type="button" class="pager-nav" id="next">Next &rsaquo;</button>
    </div>
  </div>

</div>

<script>
(() => {
  "use strict";

  /* ------------------------------------------------------------------ *
   * Config — the four props the handoff surfaces as tweaks.
   * ------------------------------------------------------------------ */
  const CONFIG = {
    accentColor: "#1d2d46",       // header bar, primary button, active filter/page, selection
    density: "comfortable",       // "comfortable" (15px) | "compact" (9px)
    rowsPerPage: 8,               // 4–16
    zebraRows: true
  };

  document.documentElement.style.setProperty("--accent", CONFIG.accentColor);
  document.documentElement.style.setProperty(
    "--cell-pad-y", CONFIG.density === "compact" ? "9px" : "15px"
  );

  /* ------------------------------------------------------------------ *
   * Placeholder data — 16 records, ids REC-4820, REC-4827, … (step 7).
   * Swap in the real API; keep the derive order in render().
   * ------------------------------------------------------------------ */
  const NAMES = ["Ethan Noah","Amelia Hart","Marcus Reed","Priya Anand","Sofia Lindqvist","Daniel Osei","Clara Whitfield","Tomas Berger","Naomi Castillo","Owen Fletcher","Hana Sato","Julien Moreau","Ruth Abebe","Victor Ilyin","Mia Donnelly","Samir Haddad"];
  const STATUS = ["Success","In progress","Failed","Success","In progress","Success","Failed","In progress","Success","In progress","Success","Failed","In progress","Success","In progress","Success"];
  const CITIES = ["132 My Street, Kingston, New York 12401","41 Halsey Row, Newark, New Jersey 07102","8 Wren Court, Brookline, Massachusetts 02445","260 Bay Ridge, Brooklyn, New York 11209","17 Foundry Lane, Providence, Rhode Island 02903","903 Mesa Drive, Austin, Texas 78701","55 Kilburn Place, Chicago, Illinois 60614","19 Ashfield Way, Portland, Oregon 97205"];
  const PLANS = ["Standard","Professional","Exclusive","Free"];
  const DATES = ["04 March, 2026","10 March, 2026","18 March, 2026","02 April, 2026"];
  const ACTIVITY = ["2 hours ago","Yesterday","3 days ago","Last week"];

  const slug = name => name.toLowerCase().replace(/[^a-z]+/g, ".").replace(/^\.|\.$/g, "");

  const makeData = () => NAMES.map((name, i) => ({
    id: "REC-" + (4820 + i * 7),
    name,
    date: DATES[i % 4],
    status: STATUS[i],
    mobile: "+1 " + (200 + i) + " 0" + (40 + i) + " " + (1000 + i * 37),
    email: slug(name) + "@xyz.com",
    address: CITIES[i % CITIES.length],
    owner: NAMES[(i + 5) % NAMES.length],
    activity: ACTIVITY[i % 4],
    plan: PLANS[i % PLANS.length],
    note: "Imported from the March intake batch. Verification pending on the billing address; contact prefers email over phone."
  }));

  const DEFAULT_COLS = ["name", "date", "status", "mobile", "email", "address"];
  const LABELS = { name: "Name", date: "Date", status: "Status", mobile: "Mobile no", email: "Email ID", address: "Address" };
  const WIDTHS = { name: "200px", date: "140px", status: "140px", mobile: "170px", email: "210px", address: "300px" };
  const FILTERS = ["All", "Success", "In progress", "Failed"];
  const PILL_CLASS = { "Success": "success", "In progress": "progress", "Failed": "failed" };

  /* ------------------------------------------------------------------ *
   * State
   * ------------------------------------------------------------------ */
  const state = {
    data: makeData(),
    cols: DEFAULT_COLS.slice(),
    selected: Object.create(null),
    expanded: Object.create(null),
    sort: null,            // { key, dir: "asc" | "desc" }
    query: "",
    filter: "All",
    page: 0,
    picking: null,         // record id whose fields are armed for editing
    editing: null,         // { id, key } — the field currently open in an editor
    confirmRow: null,      // record id whose delete is awaiting confirmation
    confirmBulk: false     // the bulk delete is awaiting confirmation
  };

  const STATUSES = ["Success", "In progress", "Failed"];

  // Held off state so dragging never triggers a render on its own.
  let dragRow = null;
  let dragCol = null;

  /* ------------------------------------------------------------------ *
   * Icons (traced from Lucide — pencil, trash-2, chevron-down, check)
   * ------------------------------------------------------------------ */
  const svg = (size, width, body) =>
    '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" ' +
    'stroke="currentColor" stroke-width="' + width + '" stroke-linecap="square" ' +
    'stroke-linejoin="miter">' + body + '</svg>';

  const ICON = {
    check: svg(12, 4, '<path d="M20 6 9 17l-5-5"></path>'),
    done: svg(15, 2, '<path d="M20 6 9 17l-5-5"></path>'),   // check at action-icon scale
    cross: svg(15, 2, '<path d="M18 6 6 18"></path><path d="m6 6 12 12"></path>'),
    chevron: svg(16, 4, '<path d="M6 9l6 6 6-6"></path>'),
    pencil: svg(15, 2, '<path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path>'),
    trash: svg(15, 2, '<path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M10 11v6"></path><path d="M14 11v6"></path>')
  };

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* ------------------------------------------------------------------ *
   * DOM refs + node caches (keyed so drag survives a re-render)
   * ------------------------------------------------------------------ */
  const $ = id => document.getElementById(id);
  const table = $("table");
  const headRow = $("headRow");
  const actionTh = headRow.querySelector(".col-action");
  const thCache = new Map();      // col key -> <th>
  const bodyCache = new Map();    // record id -> <tbody>

  /* ------------------------------------------------------------------ *
   * Segmented status filter (static)
   * ------------------------------------------------------------------ */
  const filterBtns = FILTERS.map(f => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "seg-opt";
    b.textContent = f;
    b.setAttribute("aria-pressed", String(state.filter === f));
    b.addEventListener("click", () => {
      state.filter = f;
      state.page = 0;
      clearEditing();
      render();
    });
    $("filters").appendChild(b);
    return b;
  });

  /* ------------------------------------------------------------------ *
   * Reorder helpers
   * ------------------------------------------------------------------ */
  function moveRow(fromId, toId) {
    if (fromId === toId) return;
    const from = state.data.findIndex(r => r.id === fromId);
    const to = state.data.findIndex(r => r.id === toId);
    if (from < 0 || to < 0) return;
    state.data.splice(to, 0, state.data.splice(from, 1)[0]);
    state.sort = null;                       // reordering clears any active sort
    render();
  }

  function moveCol(fromKey, toKey) {
    if (fromKey === toKey) return;
    const from = state.cols.indexOf(fromKey);
    const to = state.cols.indexOf(toKey);
    if (from < 0 || to < 0) return;
    state.cols.splice(to, 0, state.cols.splice(from, 1)[0]);
    render();
  }

  /* ------------------------------------------------------------------ *
   * Node builders — created once per key, then reordered with insertBefore
   * / appendChild so the HTML5 drag source is never destroyed mid-drag.
   * ------------------------------------------------------------------ */
  function getTh(key) {
    let th = thCache.get(key);
    if (th) return th;

    th = document.createElement("th");
    th.className = "col-data";
    th.dataset.key = key;
    th.draggable = true;
    th.style.width = WIDTHS[key];
    th.innerHTML =
      '<div class="th-inner">' +
        '<span class="grip" title="Drag to reorder column">⠿</span>' +
        '<span class="th-label" data-act="sort">' + esc(LABELS[key]) + '</span>' +
        '<span class="caret">▼</span>' +
      '</div>';
    thCache.set(key, th);
    return th;
  }

  function getTbody(rec) {
    let tb = bodyCache.get(rec.id);
    if (tb) return tb;

    tb = document.createElement("tbody");
    tb.dataset.id = rec.id;
    bodyCache.set(rec.id, tb);
    return tb;
  }

  /* The open editor for one field: a three-way picker for status (an enum
     that drives the pill colors), a plain text box for everything else. */
  function editorHtml(rec, key) {
    if (key === "status") {
      return '<div class="status-pick" role="group" aria-label="Edit status">' +
        STATUSES.map(s =>
          '<button type="button" class="' + (s === rec.status ? "on" : "") + '" ' +
            'data-act="setstatus" data-value="' + esc(s) + '">' + esc(s) + '</button>'
        ).join("") +
      '</div>';
    }
    return '<input class="cell-input" type="text" ' +
      'data-id="' + esc(rec.id) + '" data-key="' + key + '" ' +
      'value="' + esc(rec[key]) + '" aria-label="Edit ' + esc(LABELS[key]) + '">';
  }

  function cellHtml(rec, key) {
    const ed = state.editing;
    if (ed && ed.id === rec.id && ed.key === key) return editorHtml(rec, key);

    // While the row is armed, every field becomes a pick target.
    const armed = state.picking === rec.id;
    const wrap = inner => armed
      ? '<button type="button" class="pick" data-act="pickcell" data-key="' + key + '" ' +
          'title="Edit ' + esc(LABELS[key]) + '">' + inner + '</button>'
      : inner;

    if (key === "status") {
      return wrap('<span class="pill ' + PILL_CLASS[rec.status] + '">' + esc(rec.status) + '</span>');
    }
    if (key === "name") {
      const open = !!state.expanded[rec.id];
      return '<div class="name-cell">' +
               '<button type="button" class="chevron' + (open ? " open" : "") + '" ' +
                 'data-act="expand" aria-expanded="' + open + '" aria-label="Toggle details">' +
                 ICON.chevron +
               '</button>' +
               wrap('<span class="name-text">' + esc(rec.name) + '</span>') +
             '</div>';
    }
    const muted = (key === "email" || key === "address") ? " muted" : "";
    return wrap('<span class="cell-text' + muted + '">' + esc(rec[key]) + '</span>');
  }

  /* The action cell has two states. Normally: edit, delete. Awaiting a delete
     confirmation: confirm, cancel — and the confirm deliberately takes the
     EDIT slot, so a second click where the trash button was cancels rather
     than destroys. */
  function actionsHtml(rec, armed) {
    if (state.confirmRow === rec.id) {
      return '<button type="button" class="icon-btn confirm" data-act="confirmdelete" ' +
               'title="Confirm delete" aria-label="Confirm delete">' + ICON.done + '</button>' +
             '<button type="button" class="icon-btn cancel" data-act="canceldelete" ' +
               'title="Keep this record" aria-label="Cancel delete">' + ICON.cross + '</button>';
    }
    return '<button type="button" class="icon-btn edit' + (armed ? " armed" : "") + '" ' +
             'data-act="edit" aria-pressed="' + armed + '" ' +
             'title="' + (armed ? "Done editing" : "Edit record — then pick a field") + '" ' +
             'aria-label="' + (armed ? "Done editing" : "Edit record") + '">' +
             (armed ? ICON.done : ICON.pencil) + '</button>' +
           '<button type="button" class="icon-btn del" data-act="delete" ' +
             'title="Delete record" aria-label="Delete record">' + ICON.trash + '</button>';
  }

  function paintRow(tb, rec, index) {
    const selected = !!state.selected[rec.id];
    const expanded = !!state.expanded[rec.id];
    const armed = state.picking === rec.id;

    tb.classList.toggle("expanded", expanded);
    tb.classList.toggle("zebra-odd", CONFIG.zebraRows && index % 2 === 1);
    tb.classList.toggle("picking", armed);
    tb.classList.toggle("confirming", state.confirmRow === rec.id);

    const cells = state.cols.map(key => '<td>' + cellHtml(rec, key) + '</td>').join("");

    // An armed row is not draggable: a draggable ancestor hijacks the
    // click-and-drag that selects text inside the open editor.
    let html =
      '<tr class="' + (selected ? "selected" : "") + '" draggable="' + !armed + '">' +
        '<td class="cell-grip"><span class="row-grip" title="Drag to reorder row">⠿</span></td>' +
        '<td class="cell-check">' +
          '<button type="button" class="check-box' + (selected ? " on" : "") + '" ' +
            'data-act="select" aria-pressed="' + selected + '" aria-label="Select row">' +
            (selected ? ICON.check : "") +
          '</button>' +
        '</td>' +
        cells +
        '<td class="cell-action">' +
          '<div class="row-actions">' + actionsHtml(rec, armed) + '</div>' +
        '</td>' +
      '</tr>';

    if (expanded) {
      const pane = (label, value) =>
        '<div class="pane"><div class="pane-label">' + label + '</div>' +
        '<div class="pane-value">' + esc(value) + '</div></div>';

      html +=
        '<tr>' +
          '<td class="detail-cell" colspan="' + (state.cols.length + 3) + '">' +
            '<div class="detail-grid">' +
              pane("Record ID", rec.id) +
              pane("Owner", rec.owner) +
              pane("Last activity", rec.activity) +
              pane("Plan", rec.plan) +
              '<div class="pane pane-wide">' +
                '<div class="pane-label">Note</div>' +
                '<div class="pane-note">' + esc(rec.note) + '</div>' +
              '</div>' +
            '</div>' +
          '</td>' +
        '</tr>';
    }

    tb.innerHTML = html;
  }

  /* ------------------------------------------------------------------ *
   * Derive — the order is fixed: filter (status, then query) -> sort.
   * ------------------------------------------------------------------ */
  function derive() {
    const q = state.query.trim().toLowerCase();

    let filtered = state.data.filter(r => {
      if (state.filter !== "All" && r.status !== state.filter) return false;
      if (!q) return true;
      return (r.name + " " + r.email + " " + r.address + " " + r.mobile).toLowerCase().includes(q);
    });

    if (state.sort) {
      const { key, dir } = state.sort;
      // Lexicographic on purpose — swap in real date/number comparators
      // when this is wired to a real API.
      filtered = filtered.slice().sort(
        (a, b) => String(a[key]).localeCompare(String(b[key])) * (dir === "asc" ? 1 : -1)
      );
    }
    return filtered;
  }

  /* ------------------------------------------------------------------ *
   * Render — ... -> paginate -> slice to the visible page.
   * ------------------------------------------------------------------ */
  function render() {
    const filtered = derive();

    const perPage = CONFIG.rowsPerPage;
    const pageCount = Math.max(1, Math.ceil(filtered.length / perPage));
    const page = Math.min(state.page, pageCount - 1);
    state.page = page;
    const start = page * perPage;
    const visible = filtered.slice(start, start + perPage);

    const selectedCount = Object.keys(state.selected).filter(k => state.selected[k]).length;
    const allSelected = visible.length > 0 && visible.every(r => state.selected[r.id]);

    /* stats */
    $("statTotal").textContent = state.data.length;
    $("statMatching").textContent = filtered.length;
    $("statSelected").textContent = selectedCount;

    /* status filter */
    filterBtns.forEach((b, i) => b.setAttribute("aria-pressed", String(FILTERS[i] === state.filter)));

    /* bulk bar — swaps to a confirm prompt while a bulk delete is pending */
    if (selectedCount === 0) state.confirmBulk = false;
    $("bulkBar").hidden = selectedCount === 0;
    $("bulkCount").textContent = selectedCount;
    $("bulkActions").hidden = state.confirmBulk;
    $("bulkConfirm").hidden = !state.confirmBulk;
    $("bulkConfirmCount").textContent = selectedCount;

    /* header columns — reorder in place, never rebuild */
    state.cols.forEach(key => {
      const th = getTh(key);
      const active = state.sort && state.sort.key === key;
      th.classList.toggle("is-sorted", !!active);
      const caret = th.querySelector(".caret");
      caret.classList.toggle("asc", !!active && state.sort.dir === "asc");
      headRow.insertBefore(th, actionTh);
    });

    /* select-all box */
    const sa = $("selectAll");
    sa.setAttribute("aria-pressed", String(allSelected));
    sa.innerHTML = allSelected ? ICON.check : "";

    /* body — reorder existing tbodies, detach the ones off-page */
    const keep = new Set(visible.map(r => r.id));
    bodyCache.forEach((tb, id) => {
      if (!keep.has(id) && tb.parentNode) tb.parentNode.removeChild(tb);
    });
    visible.forEach((rec, i) => {
      const tb = getTbody(rec);
      paintRow(tb, rec, i);
      table.appendChild(tb);
    });

    /* empty state */
    $("empty").hidden = visible.length !== 0;

    /* footer */
    $("range").textContent = filtered.length === 0
      ? "0"
      : (start + 1) + "–" + Math.min(start + perPage, filtered.length);
    $("footTotal").textContent = filtered.length;

    const nums = $("pageNums");
    nums.innerHTML = "";
    for (let i = 0; i < pageCount; i++) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "pager-num" + (i === page ? " active" : "");
      b.textContent = i + 1;
      if (i === page) b.setAttribute("aria-current", "page");
      b.addEventListener("click", () => { state.page = i; clearEditing(); render(); });
      nums.appendChild(b);
    }
    $("prev").disabled = page === 0;
    $("next").disabled = page >= pageCount - 1;

    /* the editor is rebuilt with its row, so put focus back into it */
    const input = currentEditor();
    if (input && document.activeElement !== input) {
      input.focus();
      input.select();
    }
  }

  /* ------------------------------------------------------------------ *
   * Events — delegated on the table so rebuilt rows stay live.
   * ------------------------------------------------------------------ */
  table.addEventListener("click", e => {
    const trigger = e.target.closest("[data-act]");
    if (!trigger) return;
    const act = trigger.dataset.act;

    // Any other interaction backs out of a pending delete.
    if (act !== "delete" && act !== "confirmdelete" && act !== "canceldelete") {
      state.confirmRow = null;
    }

    if (act === "sort") {
      // ascending -> descending -> unsorted
      const key = trigger.closest("th").dataset.key;
      state.sort = state.sort && state.sort.key === key
        ? (state.sort.dir === "asc" ? { key, dir: "desc" } : null)
        : { key, dir: "asc" };
      return render();
    }

    if (act === "all") {
      // Toggles every row on the current page; selection survives paging.
      const start = state.page * CONFIG.rowsPerPage;
      const visible = derive().slice(start, start + CONFIG.rowsPerPage);
      const on = !(visible.length > 0 && visible.every(r => state.selected[r.id]));
      visible.forEach(r => { state.selected[r.id] = on; });
      return render();
    }

    const id = trigger.closest("tbody").dataset.id;
    if (act === "select") state.selected[id] = !state.selected[id];
    else if (act === "expand") state.expanded[id] = !state.expanded[id];
    else if (act === "delete") {
      state.confirmRow = id;
      state.picking = null;      // editing and deleting are separate intents
      state.editing = null;
    }
    else if (act === "canceldelete") state.confirmRow = null;
    else if (act === "confirmdelete") {
      state.confirmRow = null;
      dropRecords(r => r.id === id);
    }
    else if (act === "edit") {
      // The pencil arms the row rather than opening one fixed field.
      state.picking = state.picking === id ? null : id;
      state.editing = null;
    }
    else if (act === "pickcell") {
      state.editing = { id, key: trigger.dataset.key };
    }
    else if (act === "setstatus") {
      const rec = state.data.find(r => r.id === id);
      if (rec) rec.status = trigger.dataset.value;
      state.editing = null;          // back to picking, so another field can follow
    }
    render();
  });

  /* ---- inline edit lifecycle ---- */

  function currentEditor() {
    const ed = state.editing;
    if (!ed) return null;
    return table.querySelector(
      '.cell-input[data-id="' + ed.id + '"][data-key="' + ed.key + '"]'
    );
  }

  // Writes the open editor's value back to the record. Returns true if an
  // edit was actually open, so callers know whether a render is owed.
  function commitEdit() {
    const ed = state.editing;
    if (!ed) return false;
    const input = currentEditor();
    const rec = state.data.find(r => r.id === ed.id);
    if (input && rec) {
      const value = input.value.trim();
      if (value) rec[ed.key] = value;   // refuse to blank a field
    }
    state.editing = null;
    return true;
  }

  // Anything that reshuffles which rows are on screen drops the per-row modes.
  function clearEditing() {
    state.picking = null;
    state.editing = null;
    state.confirmRow = null;
    state.confirmBulk = false;
  }

  // Runs before the browser moves focus, so the editor is still in the DOM and
  // the node the user is clicking is not yet replaced by a re-render. Commit
  // here, suppress the blur, and let the click land on the intact element —
  // its own handler renders. Without this, switching straight from one field
  // to another swallows the second click.
  document.addEventListener("mousedown", e => {
    if (!state.editing || !(e.target instanceof Element)) return;
    if (e.target.closest(".cell-input, .status-pick")) return;   // inside the editor

    const actionable = e.target.closest("[data-act]");
    if (actionable && table.contains(actionable)) {
      e.preventDefault();
      commitEdit();
    } else {
      commitEdit();
      render();
    }
  }, true);

  // Keyboard exits: Enter commits, Escape backs out one level at a time.
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.classList && e.target.classList.contains("cell-input")) {
      e.preventDefault();
      commitEdit();
      render();
    } else if (e.key === "Escape") {
      if (state.confirmRow || state.confirmBulk) {
        state.confirmRow = null;
        state.confirmBulk = false;
        render();
      }
      else if (state.editing) { state.editing = null; render(); }
      else if (state.picking) { state.picking = null; render(); }
    }
  });

  // Safety net for focus lost by keyboard (Tab). Pointer cases are already
  // handled above; `isConnected` skips nodes a render just detached.
  table.addEventListener("focusout", e => {
    const input = e.target;
    if (!input.classList || !input.classList.contains("cell-input")) return;
    const ed = state.editing;
    if (!ed || input.dataset.id !== ed.id || input.dataset.key !== ed.key) return;
    if (!input.isConnected) return;
    commitEdit();
    render();
  });

  function dropRecords(match) {
    // Resolve the match up front: the cleanup below clears state.selected,
    // which a predicate like `r => state.selected[r.id]` reads — re-running it
    // afterwards would match nothing and delete nothing.
    const doomed = new Set(state.data.filter(match).map(r => r.id));
    doomed.forEach(id => {
      const tb = bodyCache.get(id);
      if (tb && tb.parentNode) tb.parentNode.removeChild(tb);
      bodyCache.delete(id);
      delete state.selected[id];
      delete state.expanded[id];
      if (state.picking === id) state.picking = null;
      if (state.confirmRow === id) state.confirmRow = null;
      if (state.editing && state.editing.id === id) state.editing = null;
    });
    state.data = state.data.filter(r => !doomed.has(r.id));
  }

  /* drag: rows and columns share one handler set */
  table.addEventListener("dragstart", e => {
    const th = e.target.closest("th[data-key]");
    if (th) { dragCol = th.dataset.key; e.dataTransfer.effectAllowed = "move"; return; }
    const tb = e.target.closest("tbody[data-id]");
    if (tb) { dragRow = tb.dataset.id; e.dataTransfer.effectAllowed = "move"; }
  });

  table.addEventListener("dragenter", e => {
    if (dragCol) {
      const th = e.target.closest("th[data-key]");
      if (th) moveCol(dragCol, th.dataset.key);
      return;
    }
    if (dragRow) {
      const tb = e.target.closest("tbody[data-id]");
      if (tb) moveRow(dragRow, tb.dataset.id);
    }
  });

  table.addEventListener("dragover", e => {
    if (dragRow || dragCol) e.preventDefault();
  });

  table.addEventListener("dragend", () => { dragRow = null; dragCol = null; });

  /* toolbar */
  $("search").addEventListener("input", e => {
    state.query = e.target.value;
    state.page = 0;
    clearEditing();
    render();
  });

  $("resetOrder").addEventListener("click", () => {
    state.sort = null;
    state.cols = DEFAULT_COLS.slice();
    clearEditing();
    render();
  });

  /* bulk actions — Export and Archive are stubs, per the handoff */
  // Same two-step as the row delete — the bulk one destroys more.
  $("bulkDelete").addEventListener("click", () => { state.confirmBulk = true; render(); });
  $("bulkNo").addEventListener("click", () => { state.confirmBulk = false; render(); });
  $("bulkYes").addEventListener("click", () => {
    state.confirmBulk = false;
    dropRecords(r => !!state.selected[r.id]);
    render();
  });
  $("bulkYes").innerHTML = ICON.done;
  $("bulkNo").innerHTML = ICON.cross;

  $("bulkClear").addEventListener("click", () => {
    state.selected = Object.create(null);
    render();
  });

  /* pager */
  $("prev").addEventListener("click", () => { state.page = Math.max(0, state.page - 1); clearEditing(); render(); });
  $("next").addEventListener("click", () => { state.page = state.page + 1; clearEditing(); render(); });

  render();
})();
</script>
</body>
</html>
